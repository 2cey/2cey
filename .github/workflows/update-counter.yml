name: Update Profile Views
on:
  schedule:
    - cron: '0 * * * *' # Updates hourly
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Update views data file
        run: |
          mkdir -p data
          if [ ! -f data/views.txt ]; then echo "0" > data/views.txt; fi
          VIEWS=\
          echo \ > data/views.txt
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update profile views tracker [skip ci]"
